name: 'Terraform'
on:
    push:
        branches: [ "main"]
    pull_request:
        branches: [ "main"]
permissions:
    contents: 'read'
jobs: 
    terraform:
        name: 'Terraform'
        runs-on: ubuntu-latest
        # environment: production
        env:
            TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
            TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
            TF_VAR_supabase_anon_key: ${{ secrets.SUPABASE_ANON_KEY }}
            TF_VAR_supabase_service_key: ${{ secrets.SUPABASE_SERVICE_KEY }}
            TF_VAR_owner_username: ${{ secrets.OWNER_USERNAME }}
            TF_VAR_owner_password_hash: ${{ secrets.OWNER_PASSWORD_HASH}}
            TF_VAR_owner_session_secret: ${{ secrets.OWNER_SESSION_SECRET }}
        defaults:
                run:
                    shell: bash
                    working-directory: ./terraform
        steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v1
        #   with:
        #     cli_config_credentials_token: ${{ secrets.TF_API_TOKEN}}
        - name: Terraform Init
          run: terraform init
        - name: Terraform Fmt
          run: terraform fmt -check
        - name: Terraform Plan
          run: terraform plan -input=false
        - name: Terraform Apply
          if: github.ref == 'refs/heads/main'
          run: terraform apply -auto-approve -input=false

    
